name: Build Release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    #	配置权限
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      TAG: ${{ steps.get_tag.outputs.TAG }}
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Attach release commit to master branch
        run: |
          git checkout -B master "$GITHUB_SHA"
          git branch --show-current
      - name: "Set up JDK 21"
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle
      - name: "Set up JDK 25"
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'zulu'
      - name: "Build with Gradle"
        run: |
          chmod +x gradlew
          ./gradlew clean shadowJar -PBuildFull=false
          ./gradlew shadowJar -PBuildFull=true
      - name: "Stage"
        run: |
          mkdir -p staging
          mv build/libs/*.jar staging/
      - name: "Get Tag"
        id: get_tag
        run: |
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: "Upload Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: staging/

  release-github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Download Artifacts"
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: staging
      - name: "GitHub Release"
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "${{ needs.build.outputs.TAG }}"
          prerelease: false
          files: |
            staging/*.jar

  release-modrinth:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: "Download Artifacts"
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: staging
      - name: "Modrinth Release"
        uses: dsx137/modrinth-releaser@main
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        with:
          name: ${{ needs.build.outputs.TAG }}
          project_id: vVZc7jAV
          loaders: bukkit, folia, paper ,purpur ,spigot
          game_versions: 1.20.1:1.21.11, 26.1.2:26.2
          version_number: ${{ needs.build.outputs.TAG }}
          files: |
            staging/*-lite.jar
          changelog: "See https://github.com/ColdeZhang/Dominion/releases/tag/${{ needs.build.outputs.TAG }}"
          version_type: release
          featured: false

  release-hangar:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Attach release commit to master branch
        run: |
          git checkout -B master "$GITHUB_SHA"
          git branch --show-current
      - name: "Set up JDK 21"
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle
      - name: "Set up JDK 25"
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'zulu'
      - name: "Hangar Release"
        env:
          HANGAR_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew publishPluginPublicationToHangar -PBuildFull=false

  release-keyanchor:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Download Artifacts"
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: staging
      - name: "Find Lite JAR"
        id: find_jar
        run: |
          LITE_JAR=$(ls staging/Dominion-*-lite.jar | head -1)
          echo "LITE_JAR=$LITE_JAR" >> $GITHUB_OUTPUT
          echo "Found lite JAR: $LITE_JAR"
      - name: "Generate Changelog"
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            git log --oneline --no-merges HEAD > changelog.txt
          else
            echo "Changes since ${PREVIOUS_TAG}:" > changelog.txt
            git log --oneline --no-merges "${PREVIOUS_TAG}..HEAD" >> changelog.txt
          fi
          echo "--- Generated changelog ---"
          cat changelog.txt
      - name: "Upload to KeyAnchor"
        env:
          KEYANCHOR_CI_TOKEN: ${{ secrets.KA_TOKEN }}
        run: |
          curl --fail-with-body \
            -H "Authorization: Bearer ${KEYANCHOR_CI_TOKEN}" \
            -H "Idempotency-Key: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -F "version=${{ needs.build.outputs.TAG }}" \
            -F "commit_hash=${{ github.sha }}" \
            -F "changelog=<changelog.txt" \
            -F "artifact=@${{ steps.find_jar.outputs.LITE_JAR }}" \
            "https://keyanchor.lunadeer.cn/api/v1/ci/products/dominion-prime/builds"
