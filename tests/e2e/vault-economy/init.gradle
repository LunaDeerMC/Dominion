// ./gradlew -I tests/e2e/vault-economy/init.gradle vaultEconomyHarnessJar
import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.jvm.tasks.Jar

gradle.projectsEvaluated {
    def root = gradle.rootProject
    def core = root.project(':core')
    def compile = root.tasks.register('compileVaultEconomyHarness', JavaCompile) {
        source = root.fileTree('tests/e2e/vault-economy') { include '*.java' }
        classpath = core.configurations.compileClasspath + core.sourceSets.main.output
        destinationDirectory = root.layout.buildDirectory.dir('vault-economy/classes')
        javaCompiler = core.tasks.named('compileJava', JavaCompile).get().javaCompiler
        options.encoding = 'UTF-8'
        dependsOn core.tasks.named('classes')
    }
    root.tasks.register('vaultEconomyHarnessJar', Jar) {
        dependsOn compile
        from compile.flatMap { it.destinationDirectory }
        from root.file('tests/e2e/vault-economy/plugin.yml')
        archiveFileName = 'VaultEconomyProbe.jar'
        destinationDirectory = root.layout.buildDirectory.dir('vault-economy')
    }
}
