// Invoke from the repository root: ./gradlew -I tests/e2e/cushion263/init.gradle cushion263HarnessJar
import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.jvm.tasks.Jar

gradle.projectsEvaluated {
    def root = gradle.rootProject
    def core = root.project(':core')
    def version = root.project(':versions:v26_3')
    def compile = root.tasks.register('compileCushion263Harness', JavaCompile) {
        source = root.fileTree('tests/e2e/cushion263') { include '*.java' }
        classpath = version.configurations.compileClasspath + core.sourceSets.main.output
        destinationDirectory = root.layout.buildDirectory.dir('cushion263/classes')
        javaCompiler = version.tasks.named('compileJava', JavaCompile).get().javaCompiler
        options.encoding = 'UTF-8'
        dependsOn core.tasks.named('classes')
    }
    root.tasks.register('cushion263HarnessJar', Jar) {
        dependsOn compile
        from compile.flatMap { it.destinationDirectory }
        from root.file('tests/e2e/cushion263/plugin.yml')
        archiveFileName = 'Cushion263.jar'
        destinationDirectory = root.layout.buildDirectory.dir('cushion263')
    }
}
