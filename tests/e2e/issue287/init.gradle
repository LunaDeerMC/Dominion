// Invoke from the repository root: ./gradlew -I tests/e2e/issue287/init.gradle issue287HarnessJar
import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.jvm.tasks.Jar

gradle.projectsEvaluated {
    def root = gradle.rootProject
    def core = root.project(':core')
    def compile = root.tasks.register('compileIssue287Harness', JavaCompile) {
        source = root.fileTree('tests/e2e/issue287') { include '*.java' }
        classpath = core.configurations.compileClasspath + core.sourceSets.main.output
        destinationDirectory = root.layout.buildDirectory.dir('issue287/classes')
        javaCompiler = core.tasks.named('compileJava', JavaCompile).get().javaCompiler
        options.encoding = 'UTF-8'
        dependsOn core.tasks.named('classes')
    }
    root.tasks.register('issue287HarnessJar', Jar) {
        dependsOn compile
        from compile.flatMap { it.destinationDirectory }
        from root.file('tests/e2e/issue287/plugin.yml')
        archiveFileName = 'Issue287.jar'
        destinationDirectory = root.layout.buildDirectory.dir('issue287')
    }
}
