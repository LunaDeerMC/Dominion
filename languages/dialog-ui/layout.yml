# DialogUI icon layout.
#
# Icons use Minecraft's native atlas text-component path:
#   namespace:atlas/sprite
# The defaults below target the latest supported client resource layout.
# Custom namespaces can be used after a resource pack is installed by the
# server; the Dialog backend passes custom paths through unchanged.
schema-version: 1

# Used when a button has no more specific mapping.
default-icon: minecraft:items/item/paper

# Shared semantic button icons. Individual menus can override these below.
buttons:
  default:
    icon: minecraft:items/item/paper
  back:
    icon: ''
  home:
    icon: minecraft:items/item/compass_00
  close:
    icon: minecraft:items/item/barrier
  cancel:
    icon: minecraft:items/item/barrier
  submit:
    icon: minecraft:items/item/lime_dye
  confirm:
    icon: minecraft:items/item/lime_dye
  search:
    icon: minecraft:items/item/spyglass
  clear:
    icon: minecraft:items/item/paper
  refresh:
    icon: minecraft:items/item/clock_00
  previous:
    icon: ''
  next:
    icon: ''
  save:
    icon: minecraft:items/item/lime_dye
  apply:
