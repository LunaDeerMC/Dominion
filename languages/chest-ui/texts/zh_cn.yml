# 领地插件箱子界面的简体中文语言文件。
# {dominion}、{player}、{page} 和 {total} 等命名占位符会在界面渲染时被替换。
schema-version: 1
input:
  cancel-hint: <gray>[输入 <white>取消</white> 返回。]
  cancel-keywords:
    - 取消
  cancelled: 输入已取消。
  timeout: 输入已超时。
  create-dominion: 请输入新的领地名称。
  rename-dominion: 请输入新的领地名称。
  enter-message: 请输入新的进入提示消息。
  leave-message: 请输入新的离开提示消息。
  map-color: 请输入 0xRRGGBB 格式的颜色值。
  resize: 请输入正数；若要向该方向收缩，请在数字前添加 '-'。
  create-group: 请输入新的权限组名称。
  rename-group: 请输入新的权限组名称。
  create-template: 请输入新的权限模板名称。
  rename-template: 请输入新的权限模板名称。
  search: 请输入名称的一部分或完整名称。
errors:
  unavailable: 该页面已不可用，或你已没有权限查看。
  invalid-color: 颜色格式无效，请使用 0xRRGGBB。
  non-zero-integer: 请输入非零整数。
  auto-create-disabled: 自动创建功能已禁用，请使用命令选点流程。
titles:
  all-dominions: 所有领地
  my-dominions: 我的领地
  children: 子领地 · {dominion}
  copy-source: 选择复制来源
  environment-flags: 环境设置 · {dominion}
  guest-flags: 访客权限 · {dominion}
  member-flags: 成员权限
  group-flags: 权限组权限
  template-flags: 模板权限 · {template}
  flags: 权限
  select-template: 选择权限模板
  assign-group: 分配权限组
  remove-group-member: 移除权限组成员
  add-group-member: 添加权限组成员
  transfer-player: 转让给玩家
  add-member: 添加成员
labels:
  none: 无
  unknown: 未知
  administrator: 管理员
