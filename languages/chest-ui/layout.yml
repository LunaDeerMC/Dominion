# Dominion chest UI layout. Every row must contain exactly nine characters.
# Symbols select fixed semantic elements; changing symbols never executes commands.
# Item appearance supports material, amount, custom-model-data, glow, item-flags,
# and head-source (dynamic, viewer, none, or a UUID). Omit a symbol to hide that action.
schema-version: 1
menus:
  main:
    layout:
      - "####I####"
      - "#M#C#T#L#"
      - "##A#H####"
      - "####X####"
    symbols: { '#': filler, I: info, M: dominions, C: create, T: templates, L: titles, A: all, H: help, X: close }
    items:
      filler: { material: GRAY_STAINED_GLASS_PANE }
      info: { material: GRASS_BLOCK }
      dominions: { material: MAP }
      create: { material: GOLDEN_SHOVEL }
      templates: { material: WRITABLE_BOOK }
      titles: { material: NAME_TAG }
      all: { material: SPYGLASS }
      help: { material: KNOWLEDGE_BOOK }
      close: { material: BARRIER }
  dominion-list:
    required-elements: [content]
    layout:
      - "#########"
      - "#*******#"
      - "#*******#"
      - "#*******#"
      - "#*******#"
      - "BAQPSN##X"
    symbols: { '#': filler, '*': content, B: back, A: primary, Q: search, P: previous, S: status, N: next, X: close }
    items:
      filler: { material: GRAY_STAINED_GLASS_PANE }
      content: { material: GRASS_BLOCK }
      remote-content: { material: ENDER_CHEST }
      back: { material: ARROW }
      primary: { material: LIME_DYE }
      search: { material: SPYGLASS }
      previous: { material: SPECTRAL_ARROW }
      status: { material: PAPER }
      next: { material: SPECTRAL_ARROW }
      close: { material: BARRIER }
  dashboard:
    layout:
      - "####I####"
      - "#A#P#M#V#"
      - "###C#O###"
      - "B#######X"
    symbols: { '#': filler, I: info, A: area, P: permissions, M: people, V: appearance, C: copy, O: ownership, B: back, X: close }
    items:
      filler: { material: GRAY_STAINED_GLASS_PANE }
      info: { material: GRASS_BLOCK }
      area: { material: GOLDEN_SHOVEL }
      permissions: { material: REDSTONE_TORCH }
      people: { material: PLAYER_HEAD }
      appearance: { material: OAK_SIGN }
      copy: { material: CHEST }
      ownership: { material: TOTEM_OF_UNDYING }
      back: { material: ARROW }
      close: { material: BARRIER }
  area:
    layout:
      - "####I####"
      - "#S#R#C#D#"
      - "B###H###X"
    symbols: { '#': filler, I: info, S: set-teleport, R: resize, C: create-child, D: children, B: back, H: home, X: close }
    items:
      filler: { material: GRAY_STAINED_GLASS_PANE }
      info: { material: GRASS_BLOCK }
      set-teleport: { material: COMPASS }
      resize: { material: PISTON }
      create-child: { material: OAK_SAPLING }
      children: { material: OAK_LEAVES }
      back: { material: ARROW }
      home: { material: NETHER_STAR }
      close: { material: BARRIER }
  permissions:
    layout:
      - "####I####"
      - "##E###G##"
      - "#########"
      - "B###H###X"
    symbols: { '#': filler, I: info, E: environment, G: guest, B: back, H: home, X: close }
